name: Deploy Angular to GitHub Pages

on:
  push:
    branches: [main, copilot/create-april-2026-bill-receipts]
    paths:
      - 'bill-generator-ui/**'
      - '.github/workflows/deploy-frontend.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build Angular
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: bill-generator-ui/package-lock.json

      - name: Install dependencies
        working-directory: bill-generator-ui
        run: npm ci

      - name: Build for GitHub Pages
        working-directory: bill-generator-ui
        run: npx ng build --configuration=production --base-href "/Bill-Generator/"

      - name: Add 404.html for client-side routing
        run: cp bill-generator-ui/dist/bill-generator-ui/browser/index.html bill-generator-ui/dist/bill-generator-ui/browser/404.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: bill-generator-ui/dist/bill-generator-ui/browser

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
