name: Deploy Android to Google Play

# Triggers on every push to main/master that touches the UI or this workflow.
# Also supports manual runs via workflow_dispatch.
#
# ── Required GitHub Secrets ────────────────────────────────────────────────
#  KEYSTORE_BASE64               Base64-encoded release keystore (.jks/.keystore)
#                                Generate: keytool -genkey -v -keystore release.keystore \
#                                           -alias <ALIAS> -keyalg RSA -keysize 2048 \
#                                           -validity 10000
#                                Encode:   base64 -w 0 release.keystore            (Linux)
#                                          base64 -i release.keystore | tr -d '\n'  (macOS)
#  KEYSTORE_PASSWORD             Password for the keystore file
#  KEY_ALIAS                     Alias of the signing key inside the keystore
#  KEY_PASSWORD                  Password for the signing key
#  PLAY_STORE_SERVICE_ACCOUNT_JSON
#                                Full JSON content of a Google Play service account key.
#                                Steps:
#                                  1. Google Play Console → Setup → API access
#                                  2. Link to a Google Cloud project
#                                  3. Create a service account with "Release manager" role
#                                  4. Download the JSON key and paste the entire content here
# ───────────────────────────────────────────────────────────────────────────

on:
  push:
    branches: [main, master]
    paths:
      - 'bill-generator-ui/**'
      - '.github/workflows/deploy-android.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-deploy
  cancel-in-progress: true

jobs:
  deploy:
    name: Build & Deploy Android AAB
    runs-on: ubuntu-latest

    steps:
      # ── 1. Source ────────────────────────────────────────────────────────
      - uses: actions/checkout@v4

      # ── 2. Node / Angular ────────────────────────────────────────────────
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: bill-generator-ui/package-lock.json

      - name: Install JS dependencies
        working-directory: bill-generator-ui
        run: npm ci

      - name: Build Angular (production)
        working-directory: bill-generator-ui
        run: npx ng build --configuration=production

      # ── 3. Capacitor – generate Android project ──────────────────────────
      - name: Add Android platform
        working-directory: bill-generator-ui
        run: npx cap add android

      - name: Sync web assets into Android project
        working-directory: bill-generator-ui
        run: npx cap sync android

      # ── 4. Java / Gradle ─────────────────────────────────────────────────
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Make gradlew executable
        working-directory: bill-generator-ui/android
        run: chmod +x gradlew

      # ── 5. Keystore ──────────────────────────────────────────────────────
      - name: Decode release keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > /tmp/release.keystore

      # ── 6. Build signed AAB ──────────────────────────────────────────────
      - name: Build release AAB
        working-directory: bill-generator-ui/android
        env:
          KEYSTORE_PATH: /tmp/release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew bundleRelease \
            -Pandroid.injected.signing.store.file="$KEYSTORE_PATH" \
            -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASSWORD"

      # ── 7. Upload to Google Play (internal track) ────────────────────────
      - name: Upload AAB to Google Play – internal track
        uses: r0adkll/upload-google-play@v1.1.3
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_STORE_SERVICE_ACCOUNT_JSON }}
          # Must match the appId in bill-generator-ui/capacitor.config.ts
          packageName: com.billgenerator.app
          releaseFiles: bill-generator-ui/android/app/build/outputs/bundle/release/app-release.aab
          track: internal
          status: completed

      # ── 8. Cleanup – remove keystore from runner ─────────────────────────
      - name: Remove keystore
        if: always()
        run: rm -f /tmp/release.keystore
