services:
  - type: web
    name: bill-generator-api
    env: docker
    dockerfilePath: ./BillGeneratorApi/Dockerfile
    dockerContext: .
    plan: free
    envVars:
      - key: ASPNETCORE_URLS
        value: http://0.0.0.0:8080
      - key: OPENAI_API_KEY
        sync: false   # set this in the Render dashboard
      - key: MONGODB_CONNECTION_STRING
        sync: false   # optional: enables MongoDB-backed custom templates
      - key: MONGODB_DATABASE
        value: BillGenerator
